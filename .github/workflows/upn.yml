name: UPN functions

on:
  push:
    branches: [master]
    paths: ['Get-UniqueUPN.ps1', 'Test-UpnExist.ps1', 'Test-IsValidUpn.ps1', 'Private/**', 'Tests/Upn.Tests.ps1', '.github/workflows/upn.yml']
  pull_request:
    paths: ['Get-UniqueUPN.ps1', 'Test-UpnExist.ps1', 'Test-IsValidUpn.ps1', 'Private/**', 'Tests/Upn.Tests.ps1', '.github/workflows/upn.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install EML parser dependency
        run: ./scripts/Install-EmlDependency.ps1
      - name: Install and run Pester
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -Repository PSGallery
          Import-Module Pester -RequiredVersion 5.7.1 -Force
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = './Tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $configuration
